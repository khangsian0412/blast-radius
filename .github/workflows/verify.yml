name: Verify submission
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and run under scorer limits
        run: make sample
      - name: Validate and require zero sample misses
        run: python3 tools/validate.py sample output.jsonl --require-no-misses
      - name: Check imports, metadata readers, subtests and default comment coverage
        run: python3 tools/regressions.py
      - name: Check three valid runs and runtime resources
        run: python3 tools/benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: |
            output.jsonl
            validation.json
            output-run*.jsonl
            output-run*.log
            benchmark.json
