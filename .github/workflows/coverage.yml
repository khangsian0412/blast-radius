name: Rebuild baseline coverage
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Baseline measurements to rebuild
        type: choice
        options: [all, coverage, profiles, types, dictionaries, imports, shared, observers, enums]
        default: all
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned baseline
        run: python3 tools/fetch_baseline.py baseline
      - name: Prepare exact baseline environment
        run: docker build --platform linux/amd64 -f tools/Dockerfile.maps -t blast-maps .
      - name: Collect line, class, attribute and task coverage
        if: inputs.kind == 'all' || inputs.kind == 'coverage'
        run: docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect.py baseline maps/coverage.json --raw /workspace/coverage.raw --reads-output /workspace/source-reads.json
      - name: Collect type, import and subprocess profiles
        if: inputs.kind == 'all' || inputs.kind == 'profiles' || inputs.kind == 'types'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps sh -c 'python tools/collect_types.py baseline profiles/types.json && python tools/collect_imports.py baseline profiles/imports.json && python tools/collect_children.py baseline profiles/children.json'
      - name: Collect expanded import dependencies
        if: inputs.kind == 'imports'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect_imports.py baseline profiles/imports.json
      - name: Collect literal dictionary reads
        if: inputs.kind == 'all' || inputs.kind == 'profiles' || inputs.kind == 'dictionaries'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect_dicts.py baseline profiles/dicts.json
      - name: Collect shared fixture dependencies
        if: inputs.kind == 'all' || inputs.kind == 'profiles' || inputs.kind == 'shared'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect_shared.py baseline profiles/shared.json
      - name: Collect source and code observers
        if: inputs.kind == 'all' || inputs.kind == 'profiles' || inputs.kind == 'observers'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect_observers.py baseline profiles/observers.json
      - name: Refine enum operand domains
        if: inputs.kind == 'enums'
        run: |
          mkdir -p profiles
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace" -w /workspace blast-maps python tools/collect_enums.py baseline maps/coverage.json profiles/enums.json
      - uses: actions/upload-artifact@v4
        if: inputs.kind == 'all' || inputs.kind == 'coverage'
        with:
          name: baseline-coverage
          path: |
            maps/coverage.json
            coverage.raw
            source-reads.json
      - uses: actions/upload-artifact@v4
        if: inputs.kind != 'coverage'
        with:
          name: baseline-profiles-${{ inputs.kind }}
          path: profiles/*.json
